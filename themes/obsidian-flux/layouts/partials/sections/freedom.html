{{ $p := .Params }}
<section id="infra" class="py-2xl px-gutter scroll-mt-20">
  <div class="max-w-container-max mx-auto">
    <div class="max-w-[40rem] mb-xl">
      <h2 class="font-headline-lg text-headline-lg md:text-[2.5rem] md:leading-[1.15] text-on-surface mb-md">{{ $p.infra_title }}</h2>
      <p class="text-on-surface-variant font-body-lg text-body-lg">{{ $p.infra_lead }}</p>
    </div>
    <ul class="grid md:grid-cols-3 gap-md">
      {{ range $p.infra_points }}
      <li class="surface-card">
        <h3 class="text-on-surface font-semibold mb-sm">{{ .title }}</h3>
        <p class="text-on-surface-variant text-body-sm">{{ .text }}</p>
      </li>
      {{ end }}
    </ul>
  </div>
</section>
