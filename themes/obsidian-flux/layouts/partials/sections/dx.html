{{ $p := .Params }}
<section id="cli" class="py-2xl px-gutter border-y border-[#262626] bg-surface-container-lowest scroll-mt-20">
  <div class="max-w-container-max mx-auto grid lg:grid-cols-12 gap-xl items-start">
    <div class="lg:col-span-5">
      <h2 class="font-headline-lg text-headline-lg md:text-[2.5rem] md:leading-[1.15] text-on-surface mb-md">{{ $p.dx_title }}</h2>
      <p class="text-on-surface-variant font-body-lg text-body-lg mb-lg">{{ $p.dx_lead }}</p>
      <h3 class="font-label-caps text-label-caps text-on-surface mb-sm uppercase tracking-[0.08em]">{{ $p.dx_aside_title }}</h3>
      <ul class="flex flex-col gap-sm">
        {{ range $p.dx_aside }}
        <li class="text-on-surface-variant text-body-sm ps-md border-s border-primary/60">{{ . }}</li>
        {{ end }}
      </ul>
    </div>
    <div class="lg:col-span-7" dir="ltr">
      <div class="terminal-mock">
        <div class="terminal-mock__header">
          <span class="terminal-mock__dot bg-[#3a3939]"></span>
          <span class="terminal-mock__dot bg-[#3a3939]"></span>
          <span class="terminal-mock__dot bg-[#3a3939]"></span>
          <span class="ms-auto text-on-surface-variant text-code-sm">paas2</span>
        </div>
        <div class="terminal-mock__body">
          {{ range $p.dx_commands }}
          <div><span class="muted">$</span> {{ . }}</div>
          {{ end }}
        </div>
      </div>
      <p class="mt-md text-body-sm text-outline">{{ $p.dx_footnote }}</p>
    </div>
  </div>
</section>
