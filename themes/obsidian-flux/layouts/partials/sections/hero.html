{{ $p := .Params }}
<section class="relative pt-xl pb-2xl px-gutter border-b border-[#262626]">
  <div class="max-w-container-max mx-auto grid lg:grid-cols-12 gap-xl items-center">
    <div class="lg:col-span-5 flex flex-col gap-lg">
      <p class="font-label-caps text-label-caps text-primary uppercase tracking-[0.14em]">
        {{ $p.hero_eyebrow }}
      </p>
      <h1 class="font-display-hero text-[2.5rem] leading-[1.08] md:text-[3.25rem] md:leading-[1.05] text-on-surface">
        {{ $p.hero_title }}
      </h1>
      <p class="font-body-lg text-body-lg text-on-surface-variant max-w-[42ch]">
        {{ $p.hero_lead }}
      </p>
      <div class="flex flex-wrap gap-md">
        <a href="{{ .Site.Params.userPanel }}" class="inline-flex items-center bg-primary text-on-primary font-label-caps text-label-caps px-lg py-md rounded-sm hover:bg-primary-container transition-colors">
          {{ i18n "cta_get_started" }}
        </a>
        <a href="#platform" class="inline-flex items-center border border-[#262626] text-on-surface font-label-caps text-label-caps px-lg py-md rounded-sm hover:bg-surface-container-low transition-colors">
          {{ i18n "cta_explore" }}
        </a>
      </div>
    </div>

    <figure class="lg:col-span-7 console" dir="ltr">
      <div class="console__bar">
        <span class="console__dot"></span>
        <span class="console__dot"></span>
        <span class="console__dot"></span>
        <span class="console__title">{{ $p.console_apps_label }}</span>
      </div>
      <div class="console__body">
        <ul class="console__apps">
          {{ range $p.console_apps }}
          <li class="console__app">
            <div class="console__app-main">
              <span class="console__name">{{ .name }}</span>
              <span class="console__image">{{ .image }}</span>
            </div>
            <div class="console__meta">
              <span class="console__status console__status--{{ .status }}">{{ .status_label }}</span>
              <span class="console__replicas">{{ .replicas }}</span>
            </div>
          </li>
          {{ end }}
        </ul>
        <div class="console__assistant">
          <p class="console__assistant-label">{{ $p.console_assistant_label }}</p>
          {{ range $p.console_thread }}
          <p class="console__line console__line--{{ .role }}">
            <span class="console__who">{{ .role }}</span>
            {{ .text }}
          </p>
          {{ end }}
        </div>
      </div>
      <figcaption class="console__caption">{{ $p.hero_caption }}</figcaption>
    </figure>
  </div>
</section>
