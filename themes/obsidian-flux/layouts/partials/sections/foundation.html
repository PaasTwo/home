{{ $p := .Params }}
<section id="foundation" class="py-2xl px-gutter border-y border-[#262626] bg-surface-container-lowest scroll-mt-20">
  <div class="max-w-container-max mx-auto grid lg:grid-cols-12 gap-xl">
    <div class="lg:col-span-5">
      <h2 class="font-headline-lg text-headline-lg md:text-[2.5rem] md:leading-[1.15] text-on-surface mb-md">{{ $p.foundation_title }}</h2>
      <p class="text-primary font-headline-md text-headline-md mb-md">{{ $p.foundation_kicker }}</p>
      <p class="text-on-surface-variant font-body-lg text-body-lg">{{ $p.foundation_lead }}</p>
    </div>
    <ul class="lg:col-span-7 flex flex-col">
      {{ range $p.foundation_points }}
      <li class="py-md border-b border-[#262626] grid sm:grid-cols-12 gap-sm">
        <h3 class="sm:col-span-4 text-on-surface font-semibold">{{ .title }}</h3>
        <p class="sm:col-span-8 text-on-surface-variant text-body-sm">{{ .text }}</p>
      </li>
      {{ end }}
    </ul>
  </div>
</section>
