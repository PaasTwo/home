{{ $p := .Params }}
<section id="features" class="py-2xl px-gutter scroll-mt-20">
  <div class="max-w-container-max mx-auto">
    <div class="max-w-[40rem] mb-xl">
      <h2 class="font-headline-lg text-headline-lg md:text-[2.5rem] md:leading-[1.15] text-on-surface mb-md">{{ $p.features_title }}</h2>
      <p class="text-on-surface-variant font-body-lg text-body-lg">{{ $p.features_lead }}</p>
    </div>
    <ul class="grid md:grid-cols-2 lg:grid-cols-3 gap-md">
      {{ range $p.features }}
      <li class="surface-card">
        <h3 class="font-headline-md text-body-lg font-semibold text-on-surface mb-sm">{{ .title }}</h3>
        <p class="text-on-surface-variant text-body-sm">{{ .text }}</p>
      </li>
      {{ end }}
    </ul>
    <div class="surface-card mt-md md:grid md:grid-cols-12 md:gap-lg md:items-start">
      <h3 class="md:col-span-4 font-headline-md text-headline-md text-primary mb-sm md:mb-0">{{ $p.ai_title }}</h3>
      <p class="md:col-span-8 text-on-surface-variant text-body-md">{{ $p.ai_text }}</p>
    </div>
  </div>
</section>
