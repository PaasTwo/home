baseURL = "https://paas2.ir/"
title = "PaaS2"
theme = "obsidian-flux"
defaultContentLanguage = "fa"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = false
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 10

[params]
  description = "The application platform for the AI era. You build. PaaS2 runs."
  brand = "PaaS2"
  github = "https://github.com/PaasTwo"
  userPanel = "https://panel.paas2.ir"
  adminPanel = "https://admin.pdcloud.ir"
  swagger = "https://api.paas2.ir/swagger/index.html"
  creditUrl = "https://otsi.ir"
  creditName = "Otsi"

[languages]
  [languages.fa]
    locale = "fa"
    label = "فارسی"
    direction = "rtl"
    weight = 1
    contentDir = "content/fa"
    title = "PaaS2 — شما می‌سازید. PaaS2 اجرا می‌کند."
    [languages.fa.params]
      description = "پلتفرم اپلیکیشن برای عصر هوش مصنوعی. استقرار، مقیاس، پایش و عملیات را ساده‌تر می‌کند."

  [languages.en]
    locale = "en"
    label = "English"
    direction = "ltr"
    weight = 2
    contentDir = "content/en"
    title = "PaaS2 — You Build. PaaS2 Runs."
    [languages.en.params]
      description = "The application platform for the AI era. You build the software. PaaS2 simplifies deployment, scaling, monitoring, and operations."

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"
    lineNos = false
