name: p2home

services:
  home:
    build: .
    image: paas2-home:latest
    container_name: paas2_home
    ports:
      - 6180:6180
    networks:
      - paas2-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.p2home.rule=Host(`${HOME_DOMAIN}`)"
      - "traefik.http.routers.p2home.entrypoints=web"
      - "traefik.http.services.p2home.loadbalancer.server.port=6180"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6180/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  paas2-network:
    external: true
